name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only torch + test deps
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install soundfile numpy tqdm pytest onnx onnxruntime
      - name: Run no-download test suite
        run: pytest -q
